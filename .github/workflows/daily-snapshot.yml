name: Daily snapshot

# Regula 3.2 (AGENTS.md): fiecare zi fără acest job e o zi de istoric
# pierdută definitiv — de asta rulează separat de deploy-ul aplicației.

on:
  schedule:
    # 03:00 UTC — după ce se resetează ferestrele "24h" ale DefiLlama.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

# Dacă o rulare manuală se suprapune peste cea programată, o lăsăm pe cea
# nouă să aștepte, nu s-o anulăm: fiecare rulare scrie o zi de istoric.
concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # Rularea normală durează ~2 minute. Dacă DefiLlama atârnă, oprim
    # jobul în loc să consume minutele de Actions până la limita implicită.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Aceeași versiune ca în dezvoltare, ca să nu apară diferențe
          # între ce testăm local și ce rulează zilnic.
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
