name: CI

# Rulează la fiecare push și pe pull request-uri.
#
# Deliberat SEPARAT de daily-snapshot.yml: testele verifică codul, dar nu
# trebuie să poată bloca vreodată logarea zilnică. O zi fără logare e istoric
# pierdut definitiv (regula 3.2), iar un test picat nu justifică asta.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verificare tipuri
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Teste
        run: npm test
